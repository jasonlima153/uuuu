name: Build UUUTalkFix & AntiRevoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /Users/runner/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Theos + SDK
        uses: actions/cache@v4
        with:
          path: /Users/runner/theos
          key: theos-sdk-macos-v4

      - name: Install Theos (git clone, no API)
        run: |
          if [ ! -d "$THEOS/bin" ]; then
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install iOS SDK (sparse clone)
        run: |
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            mkdir -p "$THEOS/sdks"
            cd "$THEOS/sdks"
            git init
            git remote add origin https://github.com/theos/sdks.git
            git config core.sparseCheckout true
            echo "iPhoneOS16.5.sdk/" >> .git/info/sparse-checkout
            git pull --depth=1 origin master
            ln -sf iPhoneOS16.5.sdk iPhoneOS.sdk
          fi

      - name: Install ldid
        run: brew install ldid

      - name: Build UUUTalkFix.dylib
        run: |
          make clean || true
          make

      - name: Build AntiRevoke.dylib
        run: |
          cd AntiRevoke
          make clean || true
          make

      - name: Upload UUUTalkFix artifact
        uses: actions/upload-artifact@v4
        with:
          name: UUUTalkFix.dylib
          path: .theos/obj/debug/UUUTalkFix.dylib

      - name: Upload AntiRevoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiRevoke.dylib
          path: AntiRevoke/.theos/obj/debug/AntiRevoke.dylib

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .theos/obj/debug/UUUTalkFix.dylib
            AntiRevoke/.theos/obj/debug/AntiRevoke.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
